<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Certificate Verification - Trans Eurasia University</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
  font-family: "Segoe UI", Tahoma, sans-serif;
  background: linear-gradient(135deg, #e0eafc, #cfdef3);
  margin: 0;
  padding: 0;
  color: #333;
}
.container {
  max-width: 700px;
  margin: 40px auto;
  background: #fff;
  padding: 30px 25px;
  border-radius: 16px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.15);
  text-align: center;
}
.logo-wrapper {
  display: flex;
  justify-content: center;
  align-items: center;
  background: #050782;
  border-radius: 12px;
  padding: 15px;
  margin-bottom: 20px;
}
.logo {
  max-width: 120px;
}
h1 {
  color: #050782;
  margin-bottom: 25px;
  font-size: 28px;
}
label {
  display: block;
  margin: 15px 0 8px;
  font-weight: 600;
  text-align: left;
}
input, button {
  width: 100%;
  padding: 14px;
  border-radius: 8px;
  border: 1px solid #ccc;
  font-size: 16px;
  box-sizing: border-box;
}
input:focus {
  border-color: #050782;
  outline: none;
  box-shadow: 0 0 6px rgba(5,7,130,0.4);
}
button {
  background: #050782;
  color: white;
  border: none;
  cursor: pointer;
  margin-top: 20px;
  font-size: 17px;
  font-weight: bold;
  transition: 0.3s;
}
button:hover {
  background: #0066cc;
}
.result {
  margin-top: 30px;
  border-radius: 16px;
  display: none;
  text-align: left;
  box-shadow: 0 6px 18px rgba(0,0,0,0.1);
  overflow: hidden;
  animation: fadeIn 0.5s ease-in-out;
}
.result-header {
  padding: 20px;
  font-size: 20px;
  font-weight: bold;
  color: white;
  text-align: center;
}
.result.valid .result-header {
  background: #2ecc71;
}
.result.invalid .result-header {
  background: #e74c3c;
}
.result-body {
  padding: 20px;
}
.result-body p {
  margin: 12px 0;
  font-size: 17px;
}
.degree-line {
  font-weight: bold;
  font-size: 18px;
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Responsive */
@media (max-width: 600px) {
  .container {
    margin: 20px;
    padding: 25px 15px;
  }
  h1 { font-size: 24px; }
  .result-body p { font-size: 16px; }
  .result-header { font-size: 18px; padding: 15px; }
}
</style>
</head>
<body>

<div class="container">
  <div class="logo-wrapper">
    <img src="logo.png" alt="University Logo" class="logo">
  </div>
  <h1>Certificate Verification</h1>

  <label for="cert-code">Enter Certificate Code:</label>
  <input type="text" id="cert-code" placeholder="Enter or scan certificate code">

  <button id="verify-btn">Verify Certificate</button>

  <div class="result" id="result"></div>
</div>

<script>
const codeInput = document.getElementById("cert-code");
const verifyBtn = document.getElementById("verify-btn");
const resultDiv = document.getElementById("result");

// Static certificate database
const certificates = [
  {
    code: "12-02-2017-8163",
    name: "KALU ARACHCHIGE THISARA NAYANAJITH",
    year: "2022",
    degree: "BSc Nursing",
    hons: "Hons",
    grade: "First Class"
  }
];

function showCertificate(cert) {
  const degreeText = cert.hons.toLowerCase() === "hons" ? `${cert.degree} (Hons)` : cert.degree;

  resultDiv.className = "result valid";
  resultDiv.innerHTML = `
    <div class="result-header">✅ VALID CERTIFICATE</div>
    <div class="result-body">
      <p><strong>👤 Holder:</strong> ${cert.name}</p>
      <p class="degree-line"><strong>🎓 Degree:</strong> ${degreeText}</p>
      <p><strong>📅 Graduation Year:</strong> ${cert.year}</p>
      <p><strong>⭐ Grade:</strong> ${cert.grade}</p>
    </div>
  `;
  resultDiv.style.display = "block";
}

function verifyCertificate() {
  const code = codeInput.value.trim();
  resultDiv.style.display = "none";
  if (!code) return alert("Please enter a certificate code!");

  const cert = certificates.find(c => c.code === code);
  if (cert) {
    showCertificate(cert);
  } else {
    resultDiv.className = "result invalid";
    resultDiv.innerHTML = `
      <div class="result-header">❌ INVALID CERTIFICATE</div>
      <div class="result-body">
        <p>The certificate code <b>${code}</b> was not found.</p>
      </div>
    `;
    resultDiv.style.display = "block";
  }
}

// Event listeners
verifyBtn.addEventListener("click", verifyCertificate);
codeInput.addEventListener("keypress", e => {
  if (e.key === "Enter") verifyCertificate();
});

// Auto-check if code in URL query
const params = new URLSearchParams(window.location.search);
if (params.has("code")) {
  codeInput.value = params.get("code");
  verifyCertificate();
}
</script>

</body>
</html>
