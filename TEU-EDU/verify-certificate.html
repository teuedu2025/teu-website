<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Official Certificate Verification | TEU University</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col justify-between antialiased">

    <!-- HEADER -->
    <header class="bg-[#081B33] text-white py-4 shadow-md border-b border-emerald-600">
        <div class="max-w-4xl mx-auto px-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-lg bg-emerald-500 flex items-center justify-center text-white font-bold">
                    <i class="fa-solid fa-graduation-cap text-xl"></i>
                </div>
                <div>
                    <h1 class="font-extrabold text-base tracking-wide leading-tight">TEU UNIVERSITY</h1>
                    <span class="text-[10px] text-emerald-400 block tracking-wider uppercase">Official Credential Verification Portal</span>
                </div>
            </div>
            
            <div class="flex items-center gap-3">
                <!-- Language Switcher -->
                <select id="langSelect" onchange="changeLanguage(this.value)" class="bg-[#0B2545] border border-slate-700 text-xs text-white rounded-lg px-2.5 py-1.5 focus:outline-none cursor-pointer">
                    <option value="en">🇬🇧 English</option>
                    <option value="ru">🇷🇺 Русский</option>
                </select>
                <!-- Admin Button -->
                <a href="admin.html" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-3 py-1.5 rounded-lg transition-all flex items-center gap-1.5 shadow-sm text-decoration-none">
                    <i class="fa-solid fa-lock text-[10px]"></i> Admin Panel
                </a>
            </div>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="max-w-xl mx-auto w-full px-4 py-8 flex-1 flex flex-col justify-center">
        
        <!-- CARD CONTAINER -->
        <div class="bg-white rounded-2xl shadow-xl border border-slate-200 p-6 sm:p-8">
            
            <div class="text-center mb-6">
                <div class="w-16 h-16 bg-emerald-50 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-3 border border-emerald-100 shadow-inner">
                    <i class="fa-solid fa-shield-halved text-2xl"></i>
                </div>
                <h2 id="txt-title" class="text-xl font-bold text-[#081B33]">Certificate Authenticity Check</h2>
                <p id="txt-subtitle" class="text-xs text-slate-500 mt-1">Scan QR or enter the unique certificate serial number to verify details.</p>
            </div>

            <!-- FORM -->
            <form id="verifyForm" class="space-y-4">
                <div>
                    <label id="lbl-cert-no" class="block text-[11px] font-bold text-slate-700 uppercase tracking-wider mb-1">Certificate Serial No / ID</label>
                    <div class="relative">
                        <input type="text" id="certInput" required placeholder="e.g. FMS/2017/04/098" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-3 text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:border-emerald-500 font-mono uppercase pr-10">
                        <i class="fa-solid fa-barcode absolute right-3.5 top-3.5 text-slate-400"></i>
                    </div>
                </div>

                <button type="submit" id="searchBtn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl transition-all shadow-md text-xs sm:text-sm flex items-center justify-center gap-2">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <span id="btn-text">Verify Credentials</span>
                </button>
            </form>

            <!-- RESULT DISPLAY AREA -->
            <div id="certResult" class="hidden mt-6 p-4 rounded-xl text-xs border"></div>

        </div>

    </main>

    <!-- FOOTER -->
    <footer class="bg-white border-t border-slate-200 py-4 text-center text-slate-500 text-[11px]">
        &copy; 2026 TEU University Vladivostok, Russia. Secure Verification System.
    </footer>

    <!-- FIREBASE & SEARCH SCRIPT -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDB3uxYFZCBqoYMahICvrKoTrwPh6pZcVw",
            authDomain: "teu-university.firebaseapp.com",
            projectId: "teu-university",
            storageBucket: "teu-university.firebasestorage.app",
            messagingSenderId: "963317882858",
            appId: "1:963317882858:web:70eacc2656e5e8ba3f1c93",
            measurementId: "G-70RC60SBFT"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const certId = urlParams.get('id');
            if (certId) {
                document.getElementById('certInput').value = certId;
                searchCertificateInFirebase(certId);
            }
        });

        document.getElementById('verifyForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const certId = document.getElementById('certInput').value;
            searchCertificateInFirebase(certId);
        });

        async function searchCertificateInFirebase(searchIdInput) {
            const resultDiv = document.getElementById('certResult');
            const lang = document.getElementById('langSelect').value;
            
            const searchId = searchIdInput ? searchIdInput.trim().toUpperCase() : "";

            resultDiv.classList.remove('hidden', 'bg-emerald-50', 'border-emerald-200', 'text-emerald-900', 'bg-red-50', 'border-red-200', 'text-red-900');
            resultDiv.classList.add('bg-slate-50', 'border-slate-200', 'text-slate-600');
            resultDiv.innerHTML = `<div class="text-center py-2"><i class="fa-solid fa-spinner fa-spin mr-2"></i> Verifying with cloud database...</div>`;
            resultDiv.classList.remove('hidden');

            try {
                const querySnapshot = await getDocs(collection(db, "certificates"));
                let foundCert = null;

                querySnapshot.forEach((docSnap) => {
                    const cert = docSnap.data();
                    const dbCertId = cert.certId ? cert.certId.trim().toUpperCase() : "";
                    if (dbCertId === searchId) {
                        foundCert = cert;
                    }
                });

                if (!foundCert) {
                    resultDiv.classList.remove('bg-slate-50', 'border-slate-200', 'text-slate-600');
                    resultDiv.classList.add('bg-red-50', 'border-red-200', 'text-red-900');
                    
                    if(lang === 'ru') {
                        resultDiv.innerHTML = `
                            <div class="flex items-center gap-2 text-red-700 font-bold text-sm mb-1">
                                <i class="fa-solid fa-triangle-exclamation"></i> Сертификат не найден
                            </div>
                            <p class="text-[11px] text-red-600">Введенный номер сертификата не зарегистрирован в нашей системе.</p>
                        `;
                    } else {
                        resultDiv.innerHTML = `
                            <div class="flex items-center gap-2 text-red-700 font-bold text-sm mb-1">
                                <i class="fa-solid fa-triangle-exclamation"></i> Record Not Found
                            </div>
                            <p class="text-[11px] text-red-600">The entered serial number does not match any issued certificates in our database.</p>
                        `;
                    }
                    return;
                }

                resultDiv.classList.remove('bg-slate-50', 'border-slate-200', 'text-slate-600');
                resultDiv.classList.add('bg-emerald-50', 'border-emerald-200', 'text-emerald-900');

                if(lang === 'ru') {
                    resultDiv.innerHTML = `
                        <div class="flex items-center gap-2 text-emerald-700 font-bold text-sm mb-2 border-b border-emerald-200 pb-2">
                            <i class="fa-solid fa-circle-check text-lg"></i> Подлинность Подтверждена
                        </div>
                        <div class="space-y-1.5 text-xs">
                            <p><b>ФИО:</b> ${foundCert.studentName}</p>
                            <p><b>Программа:</b> ${foundCert.programTitle}</p>
                            <p><b>Факультет:</b> ${foundCert.faculty}</p>
                            <p><b>Квалификация:</b> <span class="bg-amber-100 text-amber-800 px-1.5 py-0.5 rounded font-bold">${foundCert.grade}</span></p>
                            <p><b>Дата выдачи:</b> ${foundCert.issueDate}</p>
                            <p class="pt-1"><b>Статус:</b> <span class="bg-emerald-200 text-emerald-800 text-[10px] px-2 py-0.5 rounded font-bold">ОФИЦИАЛЬНО</span></p>
                        </div>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <div class="flex items-center gap-2 text-emerald-700 font-bold text-sm mb-2 border-b border-emerald-200 pb-2">
                            <i class="fa-solid fa-circle-check text-lg"></i> Certificate Authenticated
                        </div>
                        <div class="space-y-1.5 text-xs">
                            <p><b>Student Name:</b> ${foundCert.studentName}</p>
                            <p><b>Program / Degree:</b> ${foundCert.programTitle}</p>
                            <p><b>Faculty:</b> ${foundCert.faculty}</p>
                            <p><b>Grade Achieved:</b> <span class="bg-amber-100 text-amber-800 px-1.5 py-0.5 rounded font-bold">${foundCert.grade}</span></p>
                            <p><b>Issue Date:</b> ${foundCert.issueDate}</p>
                            <p class="pt-1"><b>Status:</b> <span class="bg-emerald-200 text-emerald-800 text-[10px] px-2 py-0.5 rounded font-bold">VERIFIED & VALID</span></p>
                        </div>
                    `;
                }

            } catch (error) {
                console.error("Verification error:", error);
                resultDiv.classList.remove('bg-slate-50', 'border-slate-200', 'text-slate-600');
                resultDiv.classList.add('bg-red-50', 'border-red-200', 'text-red-900');
                resultDiv.innerHTML = `<p class="text-red-700 font-bold">Database connection error. Please try again later.</p>`;
            }
        }

        window.changeLanguage = function(lang) {
            if(lang === 'ru') {
                document.getElementById('txt-title').innerText = "Проверка Подлинности Сертификата";
                document.getElementById('txt-subtitle').innerText = "Отсканируйте QR-код или введите номер сертификата.";
                document.getElementById('lbl-cert-no').innerText = "Серийный номер сертификата";
                document.getElementById('btn-text').innerText = "Проверить";
            } else {
                document.getElementById('txt-title').innerText = "Certificate Authenticity Check";
                document.getElementById('txt-subtitle').innerText = "Scan QR or enter the unique certificate serial number to verify details.";
                document.getElementById('lbl-cert-no').innerText = "Certificate Serial No / ID";
                document.getElementById('btn-text').innerText = "Verify Credentials";
            }
            const currentInput = document.getElementById('certInput').value;
            if(currentInput) searchCertificateInFirebase(currentInput);
        }
    </script>
</body>
</html>
